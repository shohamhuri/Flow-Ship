<div class="login-page">
    <section class="login-panel">
        <div class="brand-section">
            <div class="brand-badge">F</div>

            <div>
                <h1>FlowShip</h1>
                <p>Admin Portal</p>
            </div>
        </div>

        <div class="intro">
            <!-- <span class="eyebrow">
                SaaS Multi-Tenant
            </span> -->

            <h2>כניסה למערכת</h2>

            <p>
                התחברי באמצעות המשתמש שהוגדר עבורך.
                הטננט המתאים יזוהה אוטומטית לאחר הכניסה.
            </p>
        </div>

        <form class="login-form" (ngSubmit)="submit()">
            <label>
                <span>כתובת אימייל</span>

                <input type="email" name="email" [(ngModel)]="email" autocomplete="email"
                    placeholder="admin@example.com" [disabled]="isSubmitting" />
            </label>

            <label>
                <span>סיסמה</span>

                <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password"
                    placeholder="הזיני סיסמה" [disabled]="isSubmitting" />
            </label>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="isSubmitting">
                {{
                isSubmitting
                ? 'מתחברת...'
                : 'כניסה למערכת'
                }}
            </button>
        </form>
    </section>

    <section class="visual-panel">
        <div class="visual-content">
            <span>FlowShip Platform</span>

            <h2>
                ניהול חכם של הזמנות,
                תוכניות ומשלוחים
            </h2>

            <p>
                התחברות מאובטחת </p>
        </div>
    </section>
</div>
