<div class="home-page">
    <div class="hero">
        <div>
            <h1>ברוך הבא ל FlowShip</h1>
            <p>
                כאן תוכלו לנהל את מערך המשלוחים מקצה לקצה – מתכנון ואופטימיזציית המשלוח,
                דרך בחירת ספקי השילוח, ועד למעקב אחר הביצוע והמסירה ללקוח.
            </p>
        </div>
    </div>

    <div class="cards-grid">
        <a *ngFor="let card of cards" [routerLink]="card.route" class="portal-card">
            <div class="card-badge">{{ card.badge }}</div>
            <h3>{{ card.title }}</h3>
            <p>{{ card.description }}</p>
            <span class="card-link">כניסה למסך ←</span>
        </a>
    </div>
</div>
