name: Integration & E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flowship-backend

    env:
      FLOWSHIP_LOCAL_DB_TEST: 'true'
      DATABASE_URL: postgresql://flowship_test:local_test_password@127.0.0.1:5433/flowship_test
      TEST_FLOW_SHIP_A_API_KEY: local-test-key-a
      TEST_FLOW_SHIP_B_API_KEY: local-test-key-b
      PGPASSWORD: local_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowship_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: flowship_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U flowship_test -d flowship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowship-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: |
          set -e
          for file in \
            database/flowship-test-schema.sql \
            database/flowship-test-seed.sql \
            database/flowship-test-auth.sql \
            database/flowship-test-express.sql
          do
            echo "Loading $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run integration tests
        run: npm run test:integration

  e2e-tests:
    name: Run E2E Tests
    needs: integration-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flowship-backend

    env:
      FLOWSHIP_LOCAL_DB_TEST: 'true'
      DATABASE_URL: postgresql://flowship_test:local_test_password@127.0.0.1:5433/flowship_test
      TEST_FLOW_SHIP_A_API_KEY: local-test-key-a
      TEST_FLOW_SHIP_B_API_KEY: local-test-key-b
      PGPASSWORD: local_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowship_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: flowship_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U flowship_test -d flowship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowship-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: |
          set -e
          for file in \
            database/flowship-test-schema.sql \
            database/flowship-test-seed.sql \
            database/flowship-test-auth.sql \
            database/flowship-test-express.sql
          do
            echo "Loading $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run E2E tests
        run: npm run test:e2e
        SUPABASE_URL: https://example.supabase.co
SUPABASE_PUBLISHABLE_KEY: local-test-placeholder-key
