name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowship-backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TEST_FLOW_SHIP_A_API_KEY: ${{ secrets.TEST_FLOW_SHIP_A_API_KEY }}
      TEST_FLOW_SHIP_B_API_KEY: ${{ secrets.TEST_FLOW_SHIP_B_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Test database connection
        run: |
          node -e "const { Pool } = require('pg'); const p = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 10000 }); p.query('SELECT 1').then(() => { console.log('DATABASE CONNECTION OK'); return p.end(); }).catch(e => { console.error('DATABASE CONNECTION FAILED:', e.message); process.exit(1); });"

      - name: Run integration tests
        run: npm run test:integration