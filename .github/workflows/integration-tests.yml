name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowship-backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_FLOW_SHIP_A_API_KEY: ${{ secrets.TEST_FLOW_SHIP_A_API_KEY }}
      TEST_FLOW_SHIP_B_API_KEY: ${{ secrets.TEST_FLOW_SHIP_B_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration